stages:
  - lint
  - build
  - deploy

lint:
  stage: lint
  image: golangci/golangci-lint:latest
  script:
    - golangci-lint run -v

build:
  stage: build
  image: docker:23.0.6
  services:
    - name: docker:23.0.6-dind
      alias: docker
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t registry.forge.hefr.ch/tb-athletistics/backend --network host .
    - docker push registry.forge.hefr.ch/tb-athletistics/backend
  only:
    - main

build-seeder:
  stage: build
  image: docker:23.0.6
  services:
    - name: docker:23.0.6-dind
      alias: docker
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t registry.forge.hefr.ch/tb-athletistics/backend/seeder --network host -f seeder.Dockerfile .
    - docker push registry.forge.hefr.ch/tb-athletistics/backend/seeder
  only:
    - main

deploy:
  image:
    name: bitnami/kubectl:latest
    entrypoint: [ "" ]
  stage: deploy
  script:
    - kubectl config set-cluster local --server="https://rancher.kube.isc.heia-fr.ch/k8s/clusters/local"
    - kubectl config set-credentials local --token="$KUBE_TOKEN"
    - kubectl config set-context local --user=local --cluster=local
    - kubectl config use-context local
    - kubectl -n athletistics rollout restart deploy backend
  only:
    - main