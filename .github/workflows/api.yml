  build_publish_deploy:
    name: Build, Publish, Deploy on ${{ matrix.env.namespace }}
#    needs: test

    strategy:
      matrix:
        env: [
          {tag: latest, namespace: athletistics-dev, condition: true},
          {tag: staging, namespace: athletistics-staging, condition: true},
          {tag: stable, namespace: athletistics, condition: true}
        ]

    uses: ./.github/workflows/build-publish-deploy.yml
    secrets: inherit
    with:
      condition: ${{ matrix.env.condition }}
      tag: ${{ matrix.env.tag }}
      namespace: ${{ matrix.env.namespace }}

  build_publish_tag:
    name: Build and Publish ($tag)
#    needs: test

    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-publish.yml
    secrets: inherit
    with:
      tag: $tag