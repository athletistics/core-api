basePath: /api/v1
definitions:
  clubHandler.CreateTeam.ReqBody:
    properties:
      name:
        format: uuid
        type: string
    required:
    - name
    type: object
  models.AccessRole:
    properties:
      i18nName:
        type: string
      id:
        type: integer
    type: object
  models.Authorisation:
    properties:
      accessRoleId:
        type: integer
      clubId:
        type: string
      userId:
        type: string
    type: object
  models.Category:
    properties:
      gender:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.Club:
    properties:
      id:
        type: string
      name:
        type: string
      sport:
        $ref: '#/definitions/models.Sport'
    type: object
  models.Country:
    properties:
      code:
        type: string
      codeIso3166:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  models.DisciplineInput:
    properties:
      customName:
        type: string
      isDescending:
        type: boolean
    required:
    - customName
    - isDescending
    type: object
  models.DisciplineShort:
    properties:
      customName:
        type: string
      i18nName:
        type: string
      id:
        type: string
      isDescending:
        type: boolean
      isOfficial:
        type: boolean
    type: object
  models.EventInput:
    properties:
      date:
        type: string
      eventTypeId:
        type: integer
      isHomologated:
        type: boolean
      isOutdoor:
        type: boolean
      name:
        type: string
      place:
        type: string
    required:
    - date
    - eventTypeId
    - isHomologated
    - isOutdoor
    - name
    - place
    type: object
  models.EventShort:
    properties:
      date:
        type: string
      eventTypeId:
        type: integer
      id:
        type: string
      isHomologated:
        type: boolean
      isOutdoor:
        type: boolean
      name:
        type: string
      place:
        type: string
    type: object
  models.EventType:
    properties:
      i18nName:
        type: string
      id:
        type: integer
    type: object
  models.ExternalId:
    properties:
      externalId:
        type: string
      externalIdTypeId:
        type: integer
      internalId:
        type: string
    type: object
  models.ExternalIdInput:
    properties:
      externalId:
        type: string
      externalIdTypeId:
        type: integer
      internalId:
        type: string
    type: object
  models.ExternalIdType:
    properties:
      i18nName:
        type: string
      id:
        type: integer
    type: object
  models.Language:
    properties:
      i18nName:
        type: string
      id:
        type: integer
      short:
        type: string
    type: object
  models.NdsActivity:
    properties:
      duration:
        type: integer
      endDate:
        type: string
      id:
        type: string
      place:
        type: string
      startDate:
        type: string
      startTime:
        type: string
      team:
        $ref: '#/definitions/models.Team'
      weekday:
        type: integer
    type: object
  models.NdsActivityInput:
    properties:
      duration:
        type: integer
      endDate:
        type: string
      place:
        type: string
      startDate:
        type: string
      startTime:
        type: string
      teamId:
        type: string
      weekday:
        type: integer
    required:
    - duration
    - endDate
    - place
    - startDate
    - startTime
    - teamId
    - weekday
    type: object
  models.NdsActivityInstance:
    properties:
      date:
        type: string
      duration:
        type: integer
      id:
        type: string
      ndsActivityType:
        $ref: '#/definitions/models.NdsActivityType'
      place:
        type: string
      startTime:
        type: string
    type: object
  models.NdsActivityInstanceInput:
    properties:
      date:
        type: string
      duration:
        type: integer
      ndsActivityId:
        type: string
      ndsActivityTypeId:
        type: integer
      place:
        type: string
      startTime:
        type: string
    required:
    - date
    - ndsActivityId
    - ndsActivityTypeId
    type: object
  models.NdsActivityType:
    properties:
      i18nName:
        type: string
      id:
        type: integer
    type: object
  models.NdsAttendance:
    properties:
      isCoach:
        type: boolean
      ndsActivityInstanceId:
        type: string
      userId:
        type: string
    type: object
  models.NdsAttendanceInput:
    properties:
      isCoach:
        type: boolean
      userId:
        type: string
    type: object
  models.ParticipantInOut:
    properties:
      isCoach:
        type: boolean
      userId:
        type: string
    type: object
  models.ResultInput:
    properties:
      categoryId:
        type: string
      disciplineId:
        type: string
      eventId:
        type: string
      rank:
        type: string
      userId:
        type: string
      value:
        type: number
      wind:
        type: number
    required:
    - disciplineId
    - eventId
    - value
    type: object
  models.ResultStatic:
    properties:
      categoryId:
        type: string
      disciplineId:
        type: string
      id:
        type: integer
      resultStaticTypeId:
        type: integer
      value:
        type: number
    type: object
  models.ResultStaticOut:
    properties:
      results:
        items:
          $ref: '#/definitions/models.ResultStatic'
        type: array
      types:
        items:
          $ref: '#/definitions/models.ResultStaticType'
        type: array
    type: object
  models.ResultStaticType:
    properties:
      i18nType:
        type: string
      id:
        type: integer
    type: object
  models.ResultString:
    properties:
      categoryName:
        type: string
      date:
        type: string
      disciplineId:
        type: string
      disciplineName:
        type: string
      eventName:
        type: string
      eventOutdoor:
        type: boolean
      eventPlace:
        type: string
      id:
        type: string
      isTraining:
        type: boolean
      rank:
        type: string
      userFirstName:
        type: string
      userLastName:
        type: string
      value:
        type: number
      wind:
        type: number
    type: object
  models.Sport:
    properties:
      i18nName:
        type: string
      id:
        type: integer
    type: object
  models.Team:
    properties:
      clubId:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.User:
    properties:
      address:
        type: string
      birthDate:
        type: string
      city:
        type: string
      club:
        $ref: '#/definitions/models.Club'
      clubId:
        type: string
      country:
        $ref: '#/definitions/models.Country'
      countryId:
        type: integer
      firstName:
        type: string
      genderId:
        type: integer
      houseNumber:
        type: string
      id:
        type: string
      languageId:
        type: integer
      lastName:
        type: string
      nationality:
        $ref: '#/definitions/models.Country'
      nationalityId:
        type: integer
      oasi:
        type: string
      postCode:
        type: string
      primaryMail:
        type: string
      primaryPhone:
        type: string
      userState:
        type: string
      withLogin:
        type: boolean
    required:
    - birthDate
    - city
    - countryId
    - firstName
    - genderId
    - languageId
    - lastName
    - nationalityId
    - postCode
    - primaryPhone
    - withLogin
    type: object
  models.UserEmergency:
    properties:
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      primaryPhone:
        type: string
    required:
    - firstName
    - lastName
    - primaryPhone
    type: object
  models.UserResponse:
    properties:
      authRoles:
        items:
          $ref: '#/definitions/models.UserRole'
        type: array
      has2Fa:
        type: boolean
      is2FaOk:
        type: boolean
    type: object
  models.UserRole:
    properties:
      club:
        type: string
      role:
        type: string
    type: object
  models.UserShare:
    properties:
      code:
        type: string
    type: object
  models.UserShort:
    properties:
      birthDate:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
    required:
    - birthDate
    - firstName
    - lastName
    type: object
  res.Error:
    properties:
      error:
        type: integer
      hiddenMessage:
        type: string
      internalMessage:
        type: string
      message:
        type: string
      subCode:
        type: integer
    required:
    - error
    - message
    type: object
  res.IdCreated:
    properties:
      id:
        type: string
    type: object
  res.UuidCreated:
    properties:
      id:
        type: string
    type: object
  teamHandler.GetParticipants.response:
    properties:
      athletes:
        items:
          $ref: '#/definitions/models.UserShort'
        type: array
      coaches:
        items:
          $ref: '#/definitions/models.UserShort'
        type: array
    type: object
  userHandler.GetUsers.usersSeparated:
    properties:
      owned:
        items:
          $ref: '#/definitions/models.User'
        type: array
      shared:
        items:
          $ref: '#/definitions/models.User'
        type: array
    type: object
host: athletistics.kube.isc.heia-fr.ch
info:
  contact:
    email: nicolasfabrice.baeriswyl@edu.hefr.ch
    name: API Support
  description: API that manages the core Athletistics database containing athletes
    and their sports performances.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
  title: Core Athletistics API
  version: v0.3.0
paths:
  /club/{club_id}:
    get:
      parameters:
      - description: Club identifier
        in: path
        name: club_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Club'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Not enough permissions
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Get club details
      tags:
      - Club
  /club/{club_id}/teams:
    get:
      parameters:
      - description: Club identifier
        in: path
        name: club_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Team'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Not enough permissions
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: List teams
      tags:
      - Club
    post:
      parameters:
      - description: Club identifier
        in: path
        name: club_id
        required: true
        type: string
      - description: Team data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/clubHandler.CreateTeam.ReqBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.UuidCreated'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Not enough permissions
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Create a new team
      tags:
      - Club
  /data/accessRoles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AccessRole'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Lists all available access roles that can be given to a user.
      tags:
      - Data
  /data/categories:
    get:
      parameters:
      - description: Sport ID
        in: query
        name: sport
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Category'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Get a list of all categories for a specific sport.
      tags:
      - Data
  /data/eventTypes:
    get:
      parameters:
      - description: Filter, returning only elements that can be used by authenticated
          user
        in: query
        name: filter
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.EventType'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Get a list of all event types.
      tags:
      - Data
  /data/idTypes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ExternalIdType'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: get a list of available ID types.
      tags:
      - Data
  /data/languages:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Language'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Get all languages.
      tags:
      - Data
  /data/places/countries:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Country'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Get all countries.
      tags:
      - Data
  /data/sports:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Sport'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Get a list of all sports.
      tags:
      - Data
  /disciplines:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.DisciplineShort'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Not enough permissions
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: List disciplines
      tags:
      - Discipline
    post:
      parameters:
      - description: Discipline data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.DisciplineInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.UuidCreated'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Not enough permissions
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Create a new discipline
      tags:
      - Discipline
  /events:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.EventShort'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Not enough permissions
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: List events
      tags:
      - Event
    post:
      parameters:
      - description: Event data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.EventInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.UuidCreated'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Not enough permissions
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Create a new event
      tags:
      - Event
  /externalId/idTypes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ExternalIdType'
            type: array
      security:
      - ApiKeyAuth: []
      summary: List all available ID types.
      tags:
      - External ID
  /externalId/user:
    get:
      parameters:
      - description: Internal User identifier
        in: query
        name: internalId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ExternalId'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Not enough permissions
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: List all external IDs of a specific user.
      tags:
      - External ID
    post:
      parameters:
      - description: External ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ExternalIdInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Not enough permissions
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Creates a new external ID. The internal ID must belong to a user.
      tags:
      - External ID
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Detailed information about the connected user
      tags:
      - Personal data
  /me/auth:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Get authentication status
      tags:
      - Personal data
  /me/results:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ResultString'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Not enough permissions
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: List all personal results
      tags:
      - Personal results
    post:
      parameters:
      - description: Result data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ResultInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.UuidCreated'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Selected event is not a training
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Create a new training result for the authenticated user.
      tags:
      - Personal results
  /me/results/best:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ResultString'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Not enough permissions
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Read personal bests of authenticated user.
      tags:
      - Personal results
  /nds/activities:
    get:
      parameters:
      - description: Team id (UUID format)
        in: query
        name: teamId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.NdsActivity'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Not enough permissions
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: List all activities for a specific team.
      tags:
      - NDS Activity
    post:
      parameters:
      - description: Activity data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.NdsActivityInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.UuidCreated'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Error'
        "403":
          description: Not enough permissions
          schema:
            $ref: '#/definitions/res.Error'
      security:
      - ApiKeyAuth: []
      summary: Create a new activity and instantiate the activity once a week on the
        defined weekday between start and end date.
      tags:
      - NDS Activity
  /nds/activities/{activityId}:
    get:
      parameters:
      - description: Activity ID (UUID format)
        in: path
        name: activityId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
