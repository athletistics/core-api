version: "3.8"

services:
  core-api:
    build:
      context: .
      dockerfile: dev.Dockerfile
    env_file:
      - .env
#    command: "infisical run --env=local --path=/core -- go run main.go --gseed"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    networks:
      - athletistics
  core-db:
    image: baeriswyln/postgres-infisical
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-core:/var/lib/postgresql/data
    networks:
      - athletistics

networks:
  athletistics:
    name: athletistics
    external: true

volumes:
  postgres-db-core: