version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: dev.Dockerfile
    env_file:
      - .env
    command: "infisical run -- go run main.go --gseed"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
  db:
    image: registry.forge.hefr.ch/tb-athletistics/postgres-infisical
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-core:/var/lib/postgresql/data

volumes:
  postgres-db-core: