version: "3.8"

services:
  core-api:
    build:
      context: .
      dockerfile: dev.Dockerfile
    #    command: "infisical run --env=local --path=/core -- go run main.go --gseed"
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - ./tmp
            - ./**/*.log
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - athletistics
    depends_on:
      core-db:
        condition: service_healthy
  core-db:
    image: baeriswyln/postgres-infisical
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-core:/var/lib/postgresql/data
    networks:
      - athletistics
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  athletistics:
    name: athletistics
    external: true

volumes:
  postgres-db-core: