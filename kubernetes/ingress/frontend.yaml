apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: athletistics
spec:
  ingressClassName: nginx
  rules:
    - host: athletistics.kube.isc.heia-fr.ch
      http:
        paths:
          - backend:
              service:
                name: frontend
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - athletistics.kube.isc.heia-fr.ch