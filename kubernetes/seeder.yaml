apiVersion: batch/v1
kind: Job
metadata:
  name: core-db-seeder
spec:
  template:
    spec:
      containers:
        - name: core-db-seeder
          image: registry.forge.hefr.ch/tb-athletistics/backend/seeder
          env:
            - name: INFISICAL_TOKEN
              valueFrom:
                secretKeyRef:
                  key: INFISICAL_TOKEN
                  name: infisical-core
                  optional: false
            - name: INFISICAL_API_URL
              valueFrom:
                secretKeyRef:
                  key: INFISICAL_API_URL
                  name: infisical-core
                  optional: false
      restartPolicy: Never
      imagePullSecrets:
        - name: registry