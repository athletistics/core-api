apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: athletistics
spec:
  ports:
    - name: backend
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    workload.user.cattle.io/workloadselector: apps.deployment-athletistics-backend
  sessionAffinity: None
  type: ClusterIP
