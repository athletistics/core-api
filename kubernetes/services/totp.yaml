apiVersion: v1
kind: Service
metadata:
  name: totp
  namespace: athletistics
spec:
  ports:
    - name: totp
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    workload.user.cattle.io/workloadselector: apps.deployment-athletistics-totp
  sessionAffinity: None
  type: ClusterIP