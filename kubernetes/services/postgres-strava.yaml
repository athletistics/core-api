apiVersion: v1
kind: Service
metadata:
  name: postgres-strava
  namespace: athletistics
spec:
  ports:
    - name: stravadb
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    workload.user.cattle.io/workloadselector: apps.deployment-athletistics-postgres-strava
  sessionAffinity: None
  type: ClusterIP