apiVersion: v1
kind: Service
metadata:
  name: postgresql-core
  namespace: athletistics
spec:
  ports:
    - name: coredb
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    workload.user.cattle.io/workloadselector: apps.deployment-athletistics-postgresql-core
  sessionAffinity: None
  type: ClusterIP
status:
  loadBalancer: {}
