apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: athletistics
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
        - targets: ['localhost:9090']
      - job_name: 'zitadel'
        metrics_path: '/debug/metrics'
        scheme: https
        static_configs:
        - targets: ['athletistics-zitadel']
