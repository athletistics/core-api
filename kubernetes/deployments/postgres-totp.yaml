apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-athletistics-postgres-totp
  name: postgres-totp
  namespace: athletistics
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-athletistics-postgres-totp
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        cattle.io/timestamp: '2023-06-15T08:41:51Z'
      creationTimestamp: null
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-athletistics-postgres-totp
      name: postgres-totp
      namespace: athletistics
    spec:
      containers:
        - env:
            - name: POSTGRES_USER
              value: totpuser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: PWD_TOTP
                  name: postgres
                  optional: false
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          image: postgres:15.3
          imagePullPolicy: Always
          name: container-0
          ports:
            - containerPort: 5432
              name: totpdb
              protocol: TCP
          resources:
            limits:
              cpu: 400m
              memory: 256Mi
            requests:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: vol-s6ljx
      volumes:
        - name: vol-s6ljx
          persistentVolumeClaim:
            claimName: totpdb